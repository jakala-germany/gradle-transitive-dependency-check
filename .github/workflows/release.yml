name: 'Release'
on:
    push:
        tags:
            - '**'

jobs:
    release:
        name: "Release"
        runs-on: [ ubuntu-latest ]
        permissions:
            contents: write
        timeout-minutes: 30
        steps:
            -   name: 'Checkout'
                uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

            -   name: 'Set up JDK'
                uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v.4.7.1
                with:
                    distribution: 'temurin'
                    java-version: '17'

            -   name: 'Check & Build'
                shell: bash
                run: |
                    ./gradlew check build

            -   name: 'Publish to MavenCentral'
                shell: bash
                run: |
                    ./gradlew publishToMavenCentral
                env:
                    ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
                    ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
                    ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
                    ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SECRET_PASSPHRASE }}

            -   name: 'Extract release notes'
                id: extract-release-notes
                uses: ffurrer2/extract-release-notes@cae32133495112d23e3569ad04fef240ba4e7bc8 # v2.3.0
                with:
                    release_notes_file: RELEASE_NOTES.md

            -   name: 'Create GitHub release'
                run: gh release create ${{ github.ref_name }} --notes-file RELEASE_NOTES.md
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
